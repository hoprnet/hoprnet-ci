deployment:
  readinessProbe: |
    failureThreshold: 240
    httpGet:
      path: /readyz
      port: 3001
      scheme: HTTP
    periodSeconds: 600
    successThreshold: 1
    timeoutSeconds: 5
  livenessProbe: |
    failureThreshold: 3
    httpGet:
      path: /healthyz
      port: 3001
      scheme: HTTP
    periodSeconds: 5
    successThreshold: 1
    timeoutSeconds: 5
identityPool:
  funding:
    enabled: false
    schedule: 30 1 * * 1
    nativeAmount: 1
